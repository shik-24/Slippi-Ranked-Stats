name: Release macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Sign DMG and create release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          repo="shik-24/Slippi-Ranked-Stats"

          dmg=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Signing: $dmg"
          npm run tauri -- signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "" "$dmg"
          sig="${dmg}.sig"

          dmgName=$(basename "$dmg")
          encoded="${dmgName// /.}"
          url="https://github.com/$repo/releases/download/$tag/$encoded"
          sigContent=$(cat "$sig")
          pubDate=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          notesRaw=$(cat release-notes.md)
          notes=$(echo "$notesRaw" | awk '/^---/{exit} {print}' | tail -n +2)

          python3 -c "
          import json
          entry = {'signature': '''$sigContent''', 'url': '$url'}
          data = {
            'version': '$version',
            'notes': '''$notes''',
            'pub_date': '$pubDate',
            'platforms': {
              'darwin-aarch64': entry,
              'darwin-x86_64': entry
            }
          }
          with open('latest.json', 'w') as f:
            json.dump(data, f, indent=2)
          "

          isPreRelease=$(echo "$tag" | grep -c '\-beta' || true)
          if [ "$isPreRelease" -gt 0 ]; then
            title="Beta: Slippi Ranked Stats $tag"
            preFlag="--prerelease"
          else
            title="Slippi Ranked Stats $tag"
            preFlag=""
          fi

          gh release create "$tag" \
            --title "$title" \
            --notes-file release-notes.md \
            $preFlag \
            "$dmg" \
            "$sig" \
            latest.json
